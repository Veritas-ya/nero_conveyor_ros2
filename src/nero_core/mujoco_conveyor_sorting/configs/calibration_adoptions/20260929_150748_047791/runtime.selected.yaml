schema_version: 1

runtime:
  # Existing scripts continue to use the MuJoCo environment.  A hardware
  # launcher must select hardware explicitly and supply all concrete drivers.
  mode: simulation
  production: false

  safety:
    robot_state_max_age_s: 0.10
    gripper_state_max_age_s: 0.20
    conveyor_state_max_age_s: 0.20
    camera_frame_max_age_s: 0.25
    safety_io_max_age_s: 0.10
    require_camera: true
    require_camera_calibration: true
    require_guard_closed: true
    require_automatic_mode: false

  camera:
    backend: orbbec
    # Orbbec Gemini 335L USB model G40055-170.  The v2 SDK reports PID 0x0804;
    # refuse a similarly named 335/336/335Le so saved profiles/calibration are
    # never applied to different optics.
    expected_product_id: 0x0804
    # Bound to the camera used in the selected 18-sample calibration.
    serial_number: CP28563000CT
    enable_color: true
    require_color: false
    enable_frame_sync: true
    # Match the captured calibration profiles; no implicit profile fallback.
    # Depth: 1280x800 Y16; color: 1280x720 RGB; both 30 fps.
    depth_width: 1280
    depth_height: 800
    depth_fps: 30
    depth_format: Y16
    color_width: 1280
    color_height: 720
    color_fps: 30
    color_format: RGB
    frame_timeout_ms: 200
    startup_timeout_s: 5.0
    max_frame_age_s: 0.25
    max_consecutive_timeouts: 10
    minimum_depth_m: 0.17
    maximum_depth_m: 5.0
    # Real-world frame = NERO base, as explicitly selected by the user.
    # Maps native DEPTH optical coordinates to base/world; translation in metres.
    # User-selected result; original solver accepted=false is preserved.
    # Adoption record and backup: calibration_adoptions/20260929_150748_047791/
    calibration_id: "eye-to-hand-20260929T055050524867Z"
    camera_to_world_cv:
      - [0.04723883095606777, -0.7755505768367251, 0.6295154918286522, -0.7984577659683498]
      - [-0.9984529427490444, -0.05516645979672009, 0.006959900290744483, -0.05894638728126057]
      - [0.029330388787300807, -0.6288703567584786, -0.7769567299078016, 0.778468918917854]
      - [0.0, 0.0, 0.0, 1.0]
