hardware:
  can_channel: can0
  firmware: v121
  joint_command_mode: js
  # 经验接收时刻偏移：法兰接收时刻前 2 ms 的实测关节插值；非设备采样时间。
  joint_receive_offset_s: -0.002
command_advance_s: 0.03
# 使用同一目标实测点云的分位范围中心进行视觉卡尔曼测速。
# 固定带速仅在显式传入 --fixed-belt-speed-m-s 时启用。
velocity_source: pointcloud_xy_kalman
minimum_speed_span_s: 0.45
# 根据本次实际规划耗时安排未来起点；预约错过时重新计算，不平移旧轨迹。
planning_reserve_mode: measured
planning_reserve_s: 0.0
# 按测时调度时，在配置的最大45cm上游冻结；可达性和发送截止仍需要验证。
freeze_upstream_distance_m: 0.10
synchronized_adaptive_freeze: true
synchronized_max_freeze_upstream_distance_m: 0.45
maximum_observation_age_s: 1.0
# 2026-11-04：用户将传送带速度范围上限设为0.5m/s（50cm/s）；关节限值另行检查。
maximum_measured_speed_m_s: 0.5
planning_budget_s: 8.0
trajectory_profile: smooth
# 对齐仿真：接入末端尝试闭爪，不额外增加闭爪前同速段。
intercept_strategy: synchronized
synchronized_duration_s: 0.0
# 到达已规划接触时刻即尝试闭爪；无夹持确认也完成已认证跟随及减速，结果单独报告。
closure_policy: scheduled_attempt
# 夹爪旋转与接入同时进行，不启用独立预转阶段。
rotate_first_s: 0.0
# 2026-11-04：按用户要求边转边接近1.2秒，仅使用该接入时长。
prealign_orientation_s: 1.2
synchronized_join_candidates_s: [1.2]
planning_knot_hz: 10 # 优先以10Hz求逆解；控制发送目标频率100Hz
planning_knot_hz_fallback: 50 # 稀疏节点造成逆解/曲线/TCP误差失败时，对同一候选加密重试
geometry_check_hz: 50 # 规划阶段几何和TCP参考采样频率；关节跨度大的区间继续细分
# 每个候选重新预测接触位置；不把原接触时刻固定后拉伸关节曲线。
approach_duration_candidates_s: [2.0, 3.0, 4.0, 5.5, 6.5]
brake_duration_s: 0.4
# 2026-10-30保存输入中，优化后的第二候选用时约2.5s；给每个候选3s。
# 公共场景准备单独计时；全局8s及预约起点前30ms发送截止均继续生效。
candidate_planning_budget_s: 3.0
pick_settings:
  control_hz: 100
  speed_percent: 100
  lift_m: 0.05
  force_n: 2.0
  min_force_n: 0.2
  open_width_m: 0.1
  full_plan_close_window_s: 0.1 # 同速跟随0.1秒；连续0.2秒夹持反馈确认在减速及终点到位检查期间继续
